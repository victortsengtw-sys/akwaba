<!doctype html>

<head>

<style>
  :root { --lagoon: #2C6A68; --paper: #FAF1DF; --cream: #F2E4C9; --gold: #F7C873; --saffron: #E8A33A; --ink: #1D1A17; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--lagoon) radial-gradient(circle at 80% 15%, rgba(247, 200, 115, .18), transparent 55%);
    color: var(--paper);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 32px 24px calc(32px + env(safe-area-inset-bottom, 0px));
  }
  main { max-width: 420px; width: 100%; }
  .tag {
    display: inline-block; background: var(--saffron); color: var(--ink);
    font-weight: 700; font-size: 13px; letter-spacing: .04em;
    padding: 6px 12px; border-radius: 999px; transform: rotate(-5deg);
  }
  h1 {
    font-family: "Noto Serif TC", "Songti TC", serif; font-weight: 900;
    font-size: 34px; line-height: 1.25; margin: 22px 0 12px;
  }
  p { color: var(--cream); font-size: 16px; line-height: 1.75; margin: 0 0 28px; }
  .go {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--saffron); color: var(--ink); text-decoration: none;
    font-weight: 700; font-size: 17px; padding: 16px 20px; border-radius: 14px;
  }
  .langs { margin-top: 22px; font-size: 14px; color: var(--cream); }
  .langs a { color: var(--gold); text-decoration: none; margin-right: 14px; }
  .credit { margin-top: 40px; font-size: 12px; color: rgba(242, 228, 201, .7); }
</style>
</head>
<body>
<main>
  <span class="tag">404</span>
  <h1>這一站不在地圖上</h1>
  <p>你要找的頁面不存在，可能是網址打錯了。回到出發點，從阿比讓重新開始吧。</p>
  <a class="go" href="/?c=404">回到遊戲 →</a>
  <div class="langs">
    <a href="/sc.html?c=404" lang="zh-Hans">简体中文</a>
    <a href="/en.html?c=404" lang="en">English</a>
    <a href="/fr.html?c=404" lang="fr">Français</a>
  </div>
