<style>
/* Layout: a full-screen miniature Côte d'Ivoire behind everything; a cream sheet docks at the bottom for the map,
   and levels open as full-screen poster-style overlays (silhouette art on top, story below). One deliberate world, single theme. */
:root {
  --ink: #1D1A17;
  --paper: #FAF1DF;
  --cream: #F2E4C9;
  --muted: #6B5A47;
  --line: #DCCBA9;
  --terracotta: #B44A1E;
  --saffron: #E8A33A;
  --lagoon: #2C6A68;
  --sea: #24575A;
  --good: #2F6E45;
  --display: 'Noto Serif TC', 'Songti TC', 'PMingLiU', serif;
  --body: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
  --num: 'Fraunces', Georgia, serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--sea); color: var(--ink); font-family: var(--body); overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font-family: var(--body); color: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--terracotta); outline-offset: 3px; }
#stage { position: fixed; inset: 0; touch-action: pan-y; }
#stage canvas { display: block; width: 100%; height: 100%; }

/* ---------- top bar ---------- */
.topbar {
  position: fixed; left: 0; right: 0; top: 0; z-index: 3; pointer-events: none;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) max(14px, env(safe-area-inset-right, 0px)) 0 max(14px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; gap: 8px;
}
.pill { pointer-events: auto; background: var(--cream); border-radius: 999px; box-shadow: 0 6px 18px rgba(29, 26, 23, 0.18); }
.brand { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border: none; cursor: pointer; }
.brand-mark { width: 28px; height: 28px; border-radius: 14px; background: var(--terracotta); display: grid; place-items: center; flex-shrink: 0; }
.brand-name { font-family: var(--display); font-weight: 900; font-size: 15px; white-space: nowrap; }
.res { display: flex; align-items: center; gap: 10px; padding: 8px 12px; font-size: 12px; color: var(--muted); margin-left: auto; white-space: nowrap; overflow: hidden; min-width: 0; }
.res b { font-family: var(--num); font-weight: 600; font-size: 14px; color: var(--ink); font-variant-numeric: tabular-nums; }
.album-btn { width: 40px; height: 40px; border: none; display: grid; place-items: center; cursor: pointer; flex-shrink: 0; position: relative; }
.album-btn span { position: absolute; top: -3px; right: -3px; background: var(--terracotta); color: var(--cream); font-family: var(--num); font-size: 10.5px; min-width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; padding: 0 4px; }
@media (max-width: 460px) { .brand-name { display: none; } .brand { padding-right: 6px; } }
@media (max-width: 350px) { .res .lbl { display: none; } }
.hint {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 3; top: calc(env(safe-area-inset-top, 0px) + 64px);
  font-size: 12.5px; color: var(--cream); background: rgba(29, 26, 23, 0.6); padding: 7px 14px; border-radius: 999px;
  transition: opacity 0.5s ease; white-space: nowrap; pointer-events: none;
}
.hint.gone { opacity: 0; }

/* ---------- map sheet ---------- */
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 3;
  background: var(--cream); border-radius: 26px 26px 0 0; box-shadow: 0 -10px 30px rgba(29, 26, 23, 0.22);
  padding: 16px max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(20px, env(safe-area-inset-left, 0px));
}
.sheet-inner { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.sheet-meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.track { display: flex; gap: 3px; align-items: center; }
.track i { width: 9px; height: 5px; border-radius: 3px; background: var(--line); display: block; }
.track i.done { background: var(--lagoon); }
.track i.now { background: var(--terracotta); width: 16px; }
.track i.x { border-radius: 50%; width: 6px; height: 6px; }
.sheet h1 { margin: 0; font-family: var(--display); font-weight: 900; font-size: 27px; line-height: 1.2; text-wrap: balance; }
.sheet .place { font-size: 14px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.tag { font-size: 12px; border: 1.5px solid var(--ink); border-radius: 999px; padding: 2px 9px; color: var(--ink); }
.tag.done { border-color: var(--good); color: var(--good); }
.actions { display: flex; gap: 10px; align-items: center; margin-top: 6px; }
.icon-btn { width: 50px; height: 50px; border-radius: 25px; border: 1.5px solid var(--ink); background: transparent; display: grid; place-items: center; cursor: pointer; flex-shrink: 0; }
.icon-btn:disabled { opacity: 0.3; cursor: default; }
.primary {
  flex: 1; min-height: 50px; border-radius: 25px; border: none; background: var(--ink); color: var(--cream);
  font-size: 15.5px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 20px;
}
.primary i { width: 9px; height: 9px; border-radius: 5px; background: var(--saffron); display: block; flex-shrink: 0; }
.primary:disabled { background: var(--line); color: var(--muted); cursor: default; }
.primary:disabled i { background: var(--muted); }
.ghost { min-height: 50px; border-radius: 25px; border: 1.5px solid var(--ink); background: transparent; font-size: 15px; cursor: pointer; padding: 0 20px; }

/* ---------- overlays ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 10; background: var(--paper); overflow-y: auto; overscroll-behavior: contain;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.overlay[hidden] { display: none !important; }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 max(20px, env(safe-area-inset-right, 0px)) 28px max(20px, env(safe-area-inset-left, 0px)); }
.close-btn {
  position: fixed; z-index: 12; top: calc(env(safe-area-inset-top, 0px) + 12px); right: max(14px, env(safe-area-inset-right, 0px));
  width: 44px; height: 44px; border-radius: 22px; border: none; background: rgba(29, 26, 23, 0.55); display: grid; place-items: center; cursor: pointer;
}
.art { display: block; width: 100%; max-width: 560px; margin: 0 auto; aspect-ratio: 390 / 270; height: auto; }
.art-band { background: var(--band, var(--lagoon)); }
.kicker { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 18px; }
.kicker .no { font-family: var(--num); font-weight: 600; color: var(--paper); background: var(--ink); border-radius: 999px; padding: 1px 9px; font-size: 13px; }
.overlay h2 { font-family: var(--display); font-weight: 900; font-size: 30px; line-height: 1.2; margin: 8px 0 0; text-wrap: balance; }
.story p { font-size: 16.5px; line-height: 1.75; margin: 12px 0 0; max-width: 34em; }
.q { font-family: var(--display); font-weight: 600; font-size: 19px; line-height: 1.5; margin: 22px 0 12px; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  min-height: 52px; border-radius: 16px; border: 1.5px solid var(--ink); background: transparent; text-align: left; font-size: 15.5px; line-height: 1.45;
  padding: 12px 16px; cursor: pointer; display: flex; gap: 12px; align-items: center;
}
.opt::before { content: ""; width: 10px; height: 10px; border-radius: 5px; background: var(--saffron); flex-shrink: 0; }
.opt:nth-child(2)::before { background: var(--terracotta); }
.opt:nth-child(3)::before { background: var(--lagoon); }
.opt.picked { background: var(--ink); color: var(--paper); }
.opt.right { border-color: var(--good); background: #E3EEDD; }
.opt.wrong { border-color: var(--terracotta); background: #F6DCCD; }
.opt:disabled { cursor: default; }
.bubble { background: var(--cream); border-radius: 4px 18px 18px 18px; padding: 14px 16px; font-size: 15.5px; line-height: 1.65; margin-top: 14px; }
.next-row { display: flex; gap: 10px; margin-top: 22px; }
.clock { font-family: var(--num); font-weight: 600; font-size: 40px; letter-spacing: 1px; margin-top: 18px; display: flex; align-items: baseline; gap: 10px; }
.clock small { font-family: var(--body); font-size: 13px; color: var(--muted); letter-spacing: 0; font-weight: 400; }
.section { margin-top: 22px; }
.section h3 { font-size: 13px; font-weight: 700; color: var(--terracotta); margin: 0 0 6px; letter-spacing: 0.04em; }
.section p { margin: 0; font-size: 15.5px; line-height: 1.75; }
.culture { background: var(--cream); border-radius: 18px; padding: 14px 16px; margin-top: 22px; }
.culture h3 { color: var(--lagoon); }
.sources { margin-top: 22px; font-size: 13px; color: var(--muted); }
.sources ul { margin: 6px 0 0; padding-left: 18px; line-height: 1.7; }
.sources a { color: var(--muted); }
.answers { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
.answers div { font-size: 14px; line-height: 1.6; padding-left: 12px; border-left: 3px solid var(--saffron); color: var(--ink); }

/* ---------- mini games ---------- */
.plate-wrap { display: flex; justify-content: center; margin-top: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 44px; border-radius: 999px; border: 1.5px solid var(--ink); background: transparent; padding: 0 16px; font-size: 15px; cursor: pointer;
  display: flex; align-items: center; gap: 8px;
}
.chip .sw { width: 14px; height: 14px; border-radius: 7px; border: 1px solid rgba(29, 26, 23, 0.25); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.phone {
  width: 250px; max-width: 100%; margin: 14px auto 0; border-radius: 30px; background: var(--ink); padding: 12px; box-shadow: 0 12px 30px rgba(29, 26, 23, 0.25);
}
.screen { background: #F7F9FB; border-radius: 20px; min-height: 360px; padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; color: #12233A; }
.screen h4 { margin: 0; font-size: 15px; }
.screen .contact { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; background: #E9EEF4; border: none; width: 100%; text-align: left; cursor: pointer; font-size: 14px; min-height: 52px; }
.screen .avatar { width: 32px; height: 32px; border-radius: 16px; background: var(--saffron); flex-shrink: 0; }
.screen .amount { font-family: var(--num); font-size: 34px; font-weight: 600; text-align: center; margin-top: 10px; }
.screen .line { display: flex; justify-content: space-between; font-size: 13.5px; color: #3A4A60; }
.screen .pay { margin-top: auto; min-height: 48px; border-radius: 14px; border: none; background: #1B5FD1; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
.screen .ok { width: 64px; height: 64px; border-radius: 32px; background: var(--good); margin: 30px auto 0; display: grid; place-items: center; }
.match { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 10px; margin-top: 6px; }
.match .col { display: flex; flex-direction: column; gap: 8px; }
.tile { min-height: 50px; border-radius: 14px; border: 1.5px solid var(--ink); background: transparent; font-size: 15px; padding: 8px 10px; cursor: pointer; text-align: left; line-height: 1.35; }
.tile.word { font-family: var(--num); font-weight: 600; font-size: 16px; }
.tile.sel { background: var(--ink); color: var(--paper); }
.tile.done { border-color: var(--good); background: #E3EEDD; color: var(--good); cursor: default; }
.tile.bad { animation: shake 0.35s; border-color: var(--terracotta); }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.timer { font-family: var(--num); font-weight: 600; font-size: 15px; color: var(--terracotta); }
.rhythm { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: 10px; }
.drum {
  width: 210px; height: 210px; border-radius: 50%; border: none; background: var(--terracotta); position: relative; cursor: pointer; touch-action: manipulation;
  display: grid; place-items: center; color: var(--paper); font-family: var(--display); font-weight: 900; font-size: 22px;
}
.drum .ring { position: absolute; inset: -40px; border-radius: 50%; border: 4px solid var(--saffron); pointer-events: none; opacity: 0; }
.judge { font-family: var(--display); font-weight: 900; font-size: 20px; min-height: 28px; }
.score { font-size: 14px; color: var(--muted); }
.mapbox { margin-top: 6px; display: flex; justify-content: center; }
.region-dot { cursor: pointer; }
.order-list { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; counter-reset: step; }
.order-list div { display: flex; gap: 12px; align-items: center; font-size: 15px; padding: 10px 14px; border-radius: 14px; background: #E3EEDD; color: var(--good); }
.order-list b { font-family: var(--num); font-weight: 600; }

/* ---------- card ---------- */
.card {
  width: 280px; max-width: 100%; margin: 22px auto 0; border-radius: 22px; background: var(--ink); color: var(--paper); overflow: hidden;
  box-shadow: 0 16px 36px rgba(29, 26, 23, 0.28);
}
.card .face { height: 170px; display: grid; place-items: center; position: relative; }
.card .face .no { position: absolute; left: 14px; top: 12px; font-family: var(--num); font-weight: 600; font-size: 13px; background: var(--paper); color: var(--ink); border-radius: 999px; padding: 1px 9px; }
.card .txt { padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.card .nm { font-family: var(--display); font-weight: 900; font-size: 24px; }
.card .sb { font-size: 12.5px; color: #CDBB9B; }
.card .ft { font-size: 14px; line-height: 1.6; }
.gain { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 16px; font-size: 14px; }
.gain span { background: var(--cream); border-radius: 999px; padding: 5px 12px; }
.gain b { font-family: var(--num); }
.album-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 18px; }
.mini { border-radius: 16px; overflow: hidden; background: var(--ink); color: var(--paper); border: none; padding: 0; text-align: left; cursor: pointer; }
.mini .face { height: 92px; display: grid; place-items: center; }
.mini .nm { padding: 8px 10px 10px; font-family: var(--display); font-weight: 900; font-size: 15px; display: block; }
.mini.locked { background: var(--line); color: var(--muted); cursor: default; }
.mini.locked .face { background: #E8D9BC; }

/* ---------- intro & ending ---------- */
.intro-art { background: var(--lagoon); }
.facts { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
.facts div { display: flex; gap: 12px; align-items: center; font-size: 15.5px; }
.facts svg { flex-shrink: 0; }
.lead { font-size: 17px; line-height: 1.7; margin: 12px 0 0; }
.compare { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; margin-top: 18px; }
.compare > div { border-radius: 18px; padding: 14px; background: var(--cream); }
.compare h4 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 500; }
.compare .w { display: flex; flex-wrap: wrap; gap: 6px; }
.compare .w span { font-family: var(--display); font-weight: 900; font-size: 17px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
.stats div { background: var(--cream); border-radius: 16px; padding: 12px; text-align: center; font-size: 12.5px; color: var(--muted); }
.stats b { display: block; font-family: var(--num); font-weight: 600; font-size: 24px; color: var(--ink); }


/* ---------- 跳舞舞台 ---------- */
.stage-box { border-radius: 22px; overflow: hidden; background: #2E2340; margin-top: 6px; }
.stage-box svg { display: block; width: 100%; height: auto; }
.pad-row { display: flex; gap: 10px; margin-top: 12px; }
.pad { flex: 1; min-height: 76px; border-radius: 20px; border: none; background: var(--terracotta); color: var(--paper); font-family: var(--display); font-weight: 900; font-size: 18px; cursor: pointer; touch-action: manipulation; position: relative; overflow: hidden; }
.pad .beatbar { position: absolute; left: 0; bottom: 0; height: 6px; background: var(--saffron); width: 0; }
.pad.hit { filter: brightness(1.15); }
.combo { font-family: var(--num); font-weight: 600; font-size: 14px; color: var(--muted); }
/* ---------- 殺價 ---------- */
.haggle { background: var(--cream); border-radius: 18px; padding: 16px; margin-top: 14px; display: flex; flex-direction: column; gap: 12px; }
.haggle .price { font-family: var(--num); font-weight: 600; font-size: 30px; }
.haggle input[type=range] { width: 100%; accent-color: #B44A1E; height: 32px; }
.mood { display: flex; gap: 4px; align-items: center; font-size: 13px; color: var(--muted); }
.mood i { width: 18px; height: 8px; border-radius: 4px; background: var(--line); display: block; }
.mood i.on { background: var(--lagoon); }
.speak { border: none; background: transparent; padding: 0 0 0 6px; cursor: pointer; vertical-align: middle; }
/* ---------- 限時題 ---------- */
.tbar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin-top: 10px; }
.tbar i { display: block; height: 100%; background: var(--terracotta); width: 100%; }
.pop-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--terracotta); }
/* ---------- 分享與表單 ---------- */
.share-img { display: block; width: 100%; max-width: 320px; margin: 10px auto 0; border-radius: 16px; box-shadow: 0 10px 26px rgba(29, 26, 23, 0.25); }
.share-note { font-size: 13.5px; color: var(--muted); text-align: center; margin-top: 10px; }
.form { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
.form label { font-size: 13.5px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
.form input[type=text], .form input[type=email] { min-height: 48px; border-radius: 14px; border: 1.5px solid var(--ink); background: var(--paper); padding: 0 14px; font-size: 16px; font-family: var(--body); color: var(--ink); }
.form .checks { display: flex; flex-wrap: wrap; gap: 8px; }
.form .consent { flex-direction: row; align-items: flex-start; gap: 10px; color: var(--ink); line-height: 1.5; }
.form .consent input { width: 20px; height: 20px; margin-top: 2px; accent-color: #B44A1E; flex-shrink: 0; }
.err { color: var(--terracotta); font-size: 13.5px; min-height: 18px; }
.row-btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.row-btns > * { flex: 1 1 140px; }
.small-link { background: none; border: none; color: var(--muted); text-decoration: underline; font-size: 13.5px; cursor: pointer; padding: 8px 0; }
.modal-back { position: fixed; inset: 0; z-index: 20; background: rgba(29, 26, 23, 0.5); display: grid; align-items: end; }
.modal-back[hidden] { display: none !important; }
.modal { max-height: 92vh; overflow-y: auto; background: var(--paper); border-radius: 26px 26px 0 0; padding: 22px max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 22px) max(20px, env(safe-area-inset-left, 0px)); }
.modal .inner { max-width: 520px; margin: 0 auto; }

.toast {
  position: fixed; left: 50%; transform: translate(-50%, 8px); z-index: 30; opacity: 0; pointer-events: none;
  top: calc(env(safe-area-inset-top, 0px) + 70px); background: var(--ink); color: var(--paper);
  padding: 10px 16px; border-radius: 14px; font-size: 13.5px; transition: opacity 0.3s ease, transform 0.3s ease; max-width: 86vw; text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.fallback { position: fixed; inset: 0; display: grid; place-items: center; color: var(--cream); font-size: 14px; padding: 24px; text-align: center; }

  .hint, .toast { transition: none; }

}

/* 關卡小劇場 */
.scn { position: relative; width: 100%; border-radius: 18px; overflow: hidden; margin: 2px 0 14px; border: 2px solid var(--ink); background: var(--cream); }
.scn svg { display: block; width: 100%; height: 100%; }
.scn-bubbles { position: absolute; inset: 0; pointer-events: none; }
.scn-bubble { position: absolute; transform: translate(-50%, 6px) scale(0.9); opacity: 0; transition: opacity .2s, transform .2s; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-radius: 14px; padding: 3px 10px; font-size: 13px; font-weight: 700; line-height: 1.35; max-width: 62%; width: max-content; text-align: center; }
.scn-bubble.in { opacity: 1; transform: translate(-50%, 0) scale(1); }
.scn-bubble.big { font-size: 17px; font-family: var(--display); }
.scn-bubble::after { content: ''; position: absolute; left: 50%; bottom: -7px; width: 10px; height: 10px; background: var(--paper); border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink); transform: translateX(-50%) rotate(45deg); }
/* 分享按鈕 */
.share-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.share-btn { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; border-radius: 999px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); font: 700 14px/1 var(--sans, inherit); text-decoration: none; cursor: pointer; }
.share-btn i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.share-btn.off { opacity: 0.45; pointer-events: none; }
.credit { margin-top: 26px; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.6; }
.credit button { background: none; border: none; color: var(--muted); text-decoration: underline; font: inherit; cursor: pointer; padding: 4px; }
.about p { font-size: 14.5px; line-height: 1.75; margin: 0 0 12px; }

.author { display: flex; gap: 14px; align-items: center; margin: 18px 0 6px; padding: 12px 14px; border: 2px solid var(--ink); border-radius: 20px; background: var(--paper); }
.author .av { flex: 0 0 72px; width: 72px; height: 72px; }
.author .av svg { width: 72px; height: 72px; display: block; }
.author p { margin: 0; font-size: 14px; line-height: 1.6; }
.author b { font-family: var(--display); font-size: 16px; display: block; }
.share-img { -webkit-touch-callout: default; user-select: auto; }
.share-row.four { grid-template-columns: repeat(2, 1fr); }

/* 開場頁：一屏看到出發按鈕 */
#intro .art { aspect-ratio: auto; height: min(30vh, 260px); }
#intro h2 { margin-top: 14px; }
.lead-av { overflow: hidden; }
.lead-av .av-inline { float: left; width: 64px; height: 64px; margin: 4px 12px 2px 0; shape-outside: circle(50%); }
.lead-av .av-inline svg { width: 64px; height: 64px; display: block; }
.meta-line { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: 13.5px; color: var(--muted); }
.meta-line span { display: inline-flex; align-items: center; gap: 5px; }
.intro-cta { position: sticky; bottom: 0; z-index: 2; margin: 8px calc(-1 * max(20px, env(safe-area-inset-left, 0px))) 0; padding: 18px max(20px, env(safe-area-inset-left, 0px)) calc(env(safe-area-inset-bottom, 0px) + 14px); background: linear-gradient(rgba(250, 241, 223, 0), var(--paper) 26%); }
.intro-cta .next-row { margin-top: 0; }
.close-btn[hidden] { display: none !important; }

/* 所有頁面的插圖橫幅都壓矮一點，減少捲動 */
.overlay .art { aspect-ratio: auto; height: min(30vh, 260px); }
/* 往下滑提示 */
.scroll-hint { position: fixed; z-index: 25; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 10px 18px 10px 16px; border: none; border-radius: 999px; background: var(--ink); color: var(--paper); font: 700 15px/1 var(--sans, inherit); box-shadow: 0 8px 22px rgba(29, 26, 23, 0.35); cursor: pointer; animation: hintBob 1.4s ease-in-out infinite; }
.scroll-hint[hidden] { display: none !important; }
.scroll-hint svg { flex-shrink: 0; }
@keyframes hintBob { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, 6px); } }
@media (prefers-reduced-motion: reduce) { .scroll-hint { animation: none; } }

/* 開場頁版面 v2 */
.byline { display: flex; align-items: center; gap: 12px; margin: 12px 0 4px; }
.byline .av-s { width: 48px; height: 48px; flex: 0 0 48px; }
.byline .av-s svg { width: 48px; height: 48px; display: block; }
.byline b { display: block; font-family: var(--display); font-size: 16px; line-height: 1.2; }
.byline small { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
#intro .lead { font-size: 16px; line-height: 1.75; margin-top: 10px; }
.meta-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.meta-chips span { font-size: 12.5px; color: var(--ink); background: var(--cream); border-radius: 999px; padding: 5px 11px; }
#intro .next-row { margin-top: 18px; }
.save-cta { display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 14px; padding: 14px 16px; border: 2px solid var(--terracotta); border-radius: 18px; background: #F6E3CC; color: var(--ink); text-align: left; cursor: pointer; font: inherit; }
.save-cta .ic { flex: 0 0 38px; height: 38px; border-radius: 50%; background: var(--terracotta); display: grid; place-items: center; }
.save-cta b { display: block; font-size: 15px; color: var(--terracotta); }
.save-cta small { display: block; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.save-cta .arrow { margin-left: auto; flex-shrink: 0; }
#intro .credit { margin-top: 28px; padding-bottom: 8px; }

.modal-head { display: flex; align-items: center; justify-content: space-between; margin: -4px 0 4px; }
.mclose { width: 40px; height: 40px; border-radius: 20px; border: none; background: var(--ink); display: grid; place-items: center; cursor: pointer; flex-shrink: 0; }
.rshare-row { display: flex; justify-content: center; gap: 18px; margin-top: 16px; }
.rshare { display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: none; padding: 0; color: var(--ink); text-decoration: none; cursor: pointer; font: inherit; }
.rshare .rc { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; box-shadow: 0 4px 10px rgba(29, 26, 23, 0.18); }
.rshare .rl { font-size: 12px; color: var(--muted); }

/* 分享視窗：叉叉浮在右上角，不佔一整行 */
.modal { position: relative; }
.modal-head { position: absolute; top: 12px; right: 12px; margin: 0; z-index: 3; }
.modal-head .kicker { display: none; }
.mclose { width: 38px; height: 38px; border-radius: 19px; background: rgba(29, 26, 23, 0.82); box-shadow: 0 4px 12px rgba(29, 26, 23, 0.25); }

.sheet-credit { text-align: center; font-size: 11px; color: var(--muted); margin-top: 2px; }
.sheet-credit .about-link, .credit .about-link { background: none; border: none; color: var(--muted); text-decoration: underline; font: inherit; cursor: pointer; padding: 2px; }
.say-line { margin: -4px 0 10px; font-size: 14px; color: var(--muted); min-height: 22px; }
.say-line b { color: var(--terracotta); font-size: 16px; }
.say-line span { display: block; font-size: 12.5px; }
.privacy-note { font-size: 12px; line-height: 1.6; color: var(--muted); margin: 0; }

/* ================= 電腦版（響應式） ================= */
@media (min-width: 900px) {
  /* 地圖頁：關卡卡片浮在左下角 */
  .sheet { left: 28px; right: auto; bottom: 28px; width: 420px; border-radius: 26px; padding: 18px 22px 16px; }
  .hint { left: calc(50% + 224px); }
  .toast { top: auto; bottom: 32px; left: 32px; transform: translate(0, 8px); }
  .toast.show { transform: translate(0, 0); }
  /* 全頁畫面：左邊插圖固定，右邊內容 */
  .overlay:has(> .art-band) { display: grid; grid-template-columns: minmax(380px, 44%) 1fr; align-items: start; }
  .overlay:has(> .art-band) > .art-band { grid-column: 1; grid-row: 1 / span 30; position: sticky; top: 0; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; background: var(--band, var(--lagoon)); }
  .overlay:has(> .art-band) > :not(.art-band) { grid-column: 2; }
  .overlay .art, #intro .art { width: 100%; height: auto; max-width: none; aspect-ratio: 390 / 270; }
  .overlay:has(> .art-band) .wrap { max-width: 640px; margin: 0 auto; padding-left: 48px; padding-right: 48px; }
  .overlay:has(> .art-band) > .art-band + .wrap { padding-top: 64px; }
  .overlay h2 { font-size: 40px; }
  #intro h2 { font-size: 48px; margin-top: 0; }
  #intro .lead { font-size: 17.5px; }
  /* 關卡進行中：沒有插圖，內容置中、小劇場放大 */
  .overlay.playing { display: block; }
  .overlay.playing .wrap { max-width: 760px; margin: 0 auto; padding-left: 40px; padding-right: 40px; }
  .overlay.playing #lvBody { padding-top: 56px; }
  .overlay.playing .scn { max-width: min(600px, calc((100vh - 360px) * 390 / 230)); margin-left: auto; margin-right: auto; }
  .overlay.playing .stage-box { max-width: 600px; margin-left: auto; margin-right: auto; }
  /* 沒有插圖的頁面（圖鑑、選詞）也置中加寬 */
  .overlay:not(:has(> .art-band)) .wrap { max-width: 860px; }
  .album-grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
  /* 彈出視窗改成置中的對話框 */
  .modal-back { align-items: center; justify-items: center; padding: 24px; }
  .modal { width: 100%; max-width: 560px; max-height: 88vh; border-radius: 26px; }
  .share-img { max-width: 340px; }
  .scroll-hint { left: auto; right: 32px; transform: none; animation: none; }
}
@media (min-width: 1400px) {
  .overlay:has(> .art-band) .wrap { max-width: 700px; }
}

.home-btn { position: fixed; z-index: 12; top: calc(env(safe-area-inset-top, 0px) + 12px); left: max(14px, env(safe-area-inset-left, 0px)); height: 44px; padding: 0 14px 0 12px; border-radius: 22px; border: none; background: rgba(29, 26, 23, 0.55); color: #FAF1DF; display: flex; align-items: center; gap: 6px; font: 700 14px/1 var(--sans, inherit); cursor: pointer; }
.home-btn[hidden] { display: none !important; }
.map-lost { position: fixed; z-index: 4; left: 50%; top: 40%; transform: translate(-50%, -50%); background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-radius: 18px; padding: 16px 18px; text-align: center; font-size: 14.5px; max-width: 320px; box-shadow: 0 10px 26px rgba(29, 26, 23, 0.3); }
.map-lost button { margin-top: 10px; }
.brand { cursor: pointer; }
.back-btn { left: calc(max(14px, env(safe-area-inset-left, 0px)) + 96px); }
#intro .back-btn, .back-btn.solo { left: max(14px, env(safe-area-inset-left, 0px)); }

/* 結局頁回饋 */
.fb-card { margin-top: 22px; padding: 18px; border: 2px solid var(--ink); border-radius: 20px; background: var(--paper); }
.fb-card h3 { margin: 0 0 8px; font-family: var(--display); font-size: 19px; }
.stars { display: flex; gap: 6px; margin-bottom: 14px; }
.star { width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--line); background: var(--cream); color: var(--line); font-size: 24px; line-height: 1; cursor: pointer; }
.star.on { color: var(--saffron); border-color: var(--saffron); background: #FFF6E2; }
.fb-label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 6px; }
#fbText { width: 100%; box-sizing: border-box; border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 15px; background: #fff; }
.fb-note { font-size: 12px; color: var(--muted); margin: 6px 0 10px; }
.fb-about summary { cursor: pointer; font-size: 14px; color: var(--muted); padding: 4px 0; }
.fb-group { margin-top: 10px; }
.fb-group > span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.fb-thanks { margin: 0; font-weight: 700; color: var(--good); }
.peer { margin: 14px 0 0; padding: 12px 14px; border-radius: 14px; background: var(--cream); font-size: 15px; }
.peer b { color: var(--terracotta); font-size: 18px; }
.wall-h { margin: 24px 0 10px; font-family: var(--display); font-size: 19px; }
.wall { display: grid; gap: 10px; }
.wall blockquote { margin: 0; padding: 12px 14px; border-left: 4px solid var(--saffron); background: var(--cream); border-radius: 0 12px 12px 0; font-size: 15px; line-height: 1.6; }
@media (min-width: 900px) { .wall { grid-template-columns: 1fr 1fr; } }

        var b0 = bin.read();

        var b2 = read();
        var b3 = read();

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {

  const ABOUT = [
    ['age', '年齡', ['18 歲以下', '18–24', '25–34', '35–44', '45 以上']],
    ['gender', '性別', ['女', '男', '其他', '不透露']],
    ['africa', '去過非洲嗎', ['沒去過', '去過', '住在非洲']]
  ];
  function renderFeedback() {
    const box = $('fbCard'); if (!box) return;
    if (state.feedback) { box.innerHTML = '<p class="fb-thanks">謝謝你的回饋！</p>'; return; }
    const pick = { stars: 0 };
    box.innerHTML = '<h3>你會推薦給朋友嗎？</h3>' +
      '<div class="stars" role="radiogroup" aria-label="推薦程度">' + [1, 2, 3, 4, 5].map(function (n) { return '<button type="button" class="star" data-n="' + n + '" aria-label="' + n + ' 顆星">★</button>'; }).join('') + '</div>' +
      '<label class="fb-label" for="fbText">用一句話告訴朋友，非洲是什麼？（選填）</label>' +
      '<input id="fbText" type="text" maxlength="40" placeholder="例如：非洲比我想像的有趣太多了">' +
      '<p class="fb-note">被選上的句子會出現在玩家牆上，不會顯示你的名字。</p>' +
      '<details class="fb-about"><summary>關於你（選填，幫我們了解玩家）</summary>' +
        ABOUT.map(function (g) { return '<div class="fb-group"><span>' + g[1] + '</span><div class="chips">' + g[2].map(function (o) { return '<button type="button" class="chip" aria-pressed="false" data-g="' + g[0] + '" data-v="' + esc(o) + '">' + esc(o) + '</button>'; }).join('') + '</div></div>'; }).join('') +
      '</details>' +
      '<div class="next-row"><button class="primary" id="fbSend" disabled><i></i>送出</button></div>';
    box.querySelectorAll('.star').forEach(function (b) {
      b.addEventListener('click', function () {
        pick.stars = +b.dataset.n; SFX.tap();
        box.querySelectorAll('.star').forEach(function (x) { x.classList.toggle('on', +x.dataset.n <= pick.stars); });
        $('fbSend').disabled = false;
      });
    });
    box.querySelectorAll('.fb-group .chip').forEach(function (b) {
      b.addEventListener('click', function () {
        const g = b.dataset.g, on = pick[g] === b.dataset.v;
        box.querySelectorAll('.chip[data-g="' + g + '"]').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
        if (on) delete pick[g]; else { pick[g] = b.dataset.v; b.setAttribute('aria-pressed', 'true'); }
      });
    });
    $('fbSend').addEventListener('click', function () {
      const text = ($('fbText').value || '').trim().slice(0, 40);
      track('feedback', { stars: pick.stars, text: text, age: pick.age || '', gender: pick.gender || '', africa: pick.africa || '', pre: state.pre || [], post: state.post || [] });
      state.feedback = true; save(); SFX.good();
      box.innerHTML = '<p class="fb-thanks">謝謝你的回饋！' + (text ? '你的句子會在審核後出現在玩家牆上。' : '') + '</p>';
    });
  }
  function loadWall() {
    if (!CONFIG.endpoint || !window.fetch) return;
    fetch(CONFIG.endpoint + '?action=wall', { method: 'GET' }).then(function (r) { return r.json(); }).then(function (d) {
      if (!d) return;
      const mine = state.post || [];
      if (d.total >= 10 && d.post && mine.length) {
        let best = null; mine.forEach(function (w) { const p = d.post[w]; if (p != null && (!best || p > best[1])) best = [w, p]; });
        if (best && $('peerLine')) $('peerLine').innerHTML = '<p class="peer">你玩完後選了「' + esc(best[0]) + '」，和 <b>' + Math.round(best[1]) + '%</b> 的玩家一樣。</p>';
      }
      const q = (d.quotes || []).filter(function (t) { return typeof t === 'string' && t.trim(); }).slice(0, 6);
      if (q.length && $('wall')) $('wall').innerHTML = '<h3 class="wall-h">其他玩家怎麼說</h3><div class="wall">' + q.map(function (t) { return '<blockquote>「' + esc(t) + '」</blockquote>'; }).join('') + '</div>';
    }).catch(function () { /* 拿不到就不顯示 */ });
  }

  // ---------- 事件 ----------
  el.prev.addEventListener('click', function () { goView(view - 1); });
  el.next.addEventListener('click', function () { goView(view + 1); });
  el.go.addEventListener('click', function () { if (statusOf(view) !== 'locked') openLevel(view); });
  el.albumBtn.addEventListener('click', renderAlbum);
  el.brand.addEventListener('click', renderIntro);
  $('backBtn').addEventListener('click', function () { if (HOSTED) { try { history.back(); return; } catch (e) { /* ignore */ } } goBack(); });
  window.addEventListener('popstate', function () { if (!goBack() && !el.level.hidden) el.close.click(); });
  $('homeBtn').addEventListener('click', function () {
    if (run) { track('level_quit', { id: run.lv.id, via: 'home' }); clearRunTimers(); run = null; }
    closeModal(); renderIntro();
  });
  el.close.addEventListener('click', function () {
    if (run) { track('level_quit', { id: run.lv.id }); clearRunTimers(); run = null; }
    if (state.done.length === LEVELS.length && state.post && !el.album.hidden) { renderReport(); return; }
    hideOverlays(); renderSheet();
  });
  window.addEventListener('keydown', function (e) {
    if (!el.sheet.hidden && el.modal.hidden) { if (e.key === 'ArrowRight') goView(view + 1); if (e.key === 'ArrowLeft') goView(view - 1); }
    if (e.key === 'Escape' && !el.close.hidden) el.close.click();
  });
  let downX = null, downY = null;
  const stageEl = $('stage');
  stageEl.addEventListener('pointerdown', function (e) { downX = e.clientX; downY = e.clientY; });
  stageEl.addEventListener('pointerup', function (e) {
    if (downX === null) return; const dx = e.clientX - downX, dy = e.clientY - downY; downX = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) goView(view + (dx < 0 ? 1 : -1));
  });

  // ---------- 往下滑提示：主要按鈕在畫面外時出現 ----------
  const hintBtn = $('scrollHint');
  function currentOverlay() { return [el.level, el.ending, el.album, el.intro].filter(function (o) { return !o.hidden; })[0] || null; }
  function targetBtn(ov) {
    const list = ov.querySelectorAll('.next-row .primary:not([disabled]), .next-row .ghost:not([disabled])');
    for (let i = list.length - 1; i >= 0; i--) { if (list[i].offsetParent) return list[i]; }
    return null;
  }
  const modalBox = el.modal.querySelector('.modal');
  function modalMore() { return modalBox && modalBox.scrollHeight - modalBox.clientHeight - modalBox.scrollTop > 40; }
  function checkHint() {
    const ov = currentOverlay(); let show = false;
    if (!el.modal.hidden) show = modalMore();
    else if (ov) {
      // 下面還有按鈕或內容沒看到，就提示往下滑
      const more = ov.scrollHeight - ov.clientHeight - ov.scrollTop > 60;
      const btns = ov.querySelectorAll('button:not(.about-link):not(.close-btn), [role="button"], .phone');
      let below = false;
      for (let i = 0; i < btns.length; i++) { if (btns[i].offsetParent && btns[i].getBoundingClientRect().top > window.innerHeight - 40) { below = true; break; } }
      show = more && (below || ov.scrollHeight - ov.clientHeight - ov.scrollTop > 200);
    }
    hintBtn.hidden = !show;
  }
  if (modalBox) modalBox.addEventListener('scroll', checkHint, { passive: true });
  hintBtn.addEventListener('click', function () { if (!el.modal.hidden) { modalBox.scrollTo({ top: modalBox.scrollHeight, behavior: 'smooth' }); return; } const ov = currentOverlay(); if (!ov) return; const b = targetBtn(ov); const r = b && b.getBoundingClientRect();
    if (r && r.top > window.innerHeight) b.scrollIntoView({ behavior: 'smooth', block: 'center' }); else ov.scrollBy({ top: window.innerHeight * 0.7, behavior: 'smooth' }); });
  [el.level, el.ending, el.album, el.intro].forEach(function (o) { o.addEventListener('scroll', checkHint, { passive: true }); });
  setInterval(checkHint, 500);

  // ---------- 從哪裡來：分享連結帶的 r（分享者）和 c（平台） ----------
  (function arrival() {
    let ref = '', ch = '', from = '';
    try { const q = new URLSearchParams(location.search); ref = (q.get('r') || '').slice(0, 40); ch = (q.get('c') || '').slice(0, 20); } catch (e) { /* ignore */ }
    try { if (document.referrer) from = new URL(document.referrer).hostname; } catch (e) { from = ''; }
    if (!state.arrived) {
      state.arrived = true; save();
      track('arrive', { ref: ref && ref !== state.uid ? ref : '', ch: ch || (from ? 'web' : 'direct'), from: from });
    }
    if ((ref || ch) && HOSTED) { try { history.replaceState(null, '', location.pathname); } catch (e) { /* ignore */ } }
  })();

  // ---------- 啟動 ----------
  renderSound();
  view = firstOpen();
  renderSheet();
  function onPick(i) {
    if (!el.modal.hidden || el.sheet.hidden) return;
    const st = statusOf(i);
    if (i === view && st !== 'locked') { openLevel(i); return; }
    goView(i);
    if (st === 'locked') toast('完成前面的關卡，這一站就會解鎖');
  }
  function onMapLost() {
    if (document.querySelector('.map-lost')) return;
    const d = document.createElement('div'); d.className = 'map-lost';
    d.innerHTML = '地圖暫時無法顯示（可能是電腦的顯示卡負擔太重）。<br>你的進度都已保存，仍然可以用下方的卡片繼續玩。<br><button class="primary" type="button"><i></i>重新載入地圖</button>';
    d.querySelector('button').addEventListener('click', function () { location.reload(); });
    document.body.appendChild(d);
  }
  if (window.THREE) { try { world = createWorld(stageEl, el.sheet, flightText, onPick, onMapLost); } catch (e) { world = null; } }
  if (!world) { const f = document.createElement('div'); f.className = 'fallback'; f.textContent = '3D 地圖沒有載入成功，仍然可以用下方的卡片遊玩。'; document.body.appendChild(f); }
  renderSheet();
  if (state.done.length === LEVELS.length && state.post) renderReport();
  else renderIntro();
  if (world) setTimeout(function () { world.flyTo(view, { quiet: true, dur: 3600 }); }, 400);
})();
</script>

</body>
